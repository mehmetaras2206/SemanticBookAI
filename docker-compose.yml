# docker compose up  ->  UI on http://localhost:8080
# GPU (NVIDIA):        docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:0.40.3
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  # one-shot helpers that pull the models into the ollama volume
  pull-embed:
    image: ollama/ollama:0.40.3
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${EMBED_MODEL:-bge-m3}"]
    restart: "no"

  pull-llm:
    image: ollama/ollama:0.40.3
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${LLM_MODEL:-gemma4:12b}"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      qdrant:
        condition: service_started
      pull-embed:
        condition: service_completed_successfully
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      # prebuilt index (vectors + payloads); set empty to build it locally from the books
      INDEX_URL: ${INDEX_URL-https://github.com/mehmetaras2206/SemanticBookAI/releases/download/v1.0.0/index.tar.gz}
    volumes:
      - book_data:/srv/data/processed
      - book_raw:/srv/data/raw
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  qdrant_data:
  ollama_models:
  book_data:
  book_raw:
